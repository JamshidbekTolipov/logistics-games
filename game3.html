<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amerika vaqt mintaqalari</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f6;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        /* To'g'ri javobda yashil miltillash effekti */
        body.flash-correct {
            background-color: #10b981 !important; /* Soft Emerald Green */
        }

        /* Noto'g'ri javobda qizil miltillash effekti */
        body.flash-incorrect {
            background-color: #f43f5e !important; /* Soft Rose Red */
        }

        /* Kartalar uchun zamonaviy soya */
        .card-shadow {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08), 0 18px 36px -18px rgba(0, 0, 0, 0.05);
        }

        .btn-glow {
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
        }

        /* Noto'g'ri javob berilgandagi titrash (Shake) animatsiyasi */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        .shake-anim {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Yangi shtat chiqqandagi silliq paydo bo'lish animatsiyasi */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-8 select-none">

    <!-- TOP NAVIGATION BAR -->
    <header class="w-full max-w-4xl flex items-center justify-between z-20">
        <!-- Yuqori Chap: Uycha (Home) ikonkasi -->
        <a href="index.html" title="Main Page" class="w-12 h-12 bg-white/80 backdrop-blur-md rounded-2xl border border-white/80 card-shadow flex items-center justify-center text-gray-800 hover:scale-110 active:scale-95 transition-all duration-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
        </a>

        <!-- Yuqori O'ng: Statistikalar (To'g'ri va Urinishlar) -->
        <div class="flex items-center space-x-3 bg-white/80 backdrop-blur-md px-5 py-2.5 rounded-2xl border border-white/80 card-shadow text-sm font-semibold text-gray-700">
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span>To'g'ri javoblar: <strong id="correctScore" class="text-gray-900 font-extrabold text-base">0</strong></span>
            </div>
            <span class="text-gray-300">|</span>
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <span>Urinishlar: <strong id="attemptsScore" class="text-gray-900 font-extrabold text-base">0</strong></span>
            </div>
        </div>
    </header>

    <!-- MAIN GAME CARD CONTAINER -->
    <main class="w-full max-w-lg my-auto py-6">
        <div id="gameCard" class="w-full bg-white/90 backdrop-blur-xl rounded-[36px] p-8 sm:p-10 card-shadow border border-white/80 text-center relative overflow-hidden transition-all duration-300">
            
            <!-- Top Tag -->
            <div class="inline-flex items-center space-x-2 bg-gray-100 px-3.5 py-1 rounded-full text-xs font-bold text-gray-500 tracking-wider uppercase mb-6">
                <span>🕒 Vaqt mintaqalari</span>
            </div>

            <!-- Subtitle Instructions -->
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">To'g'ri vaqt mintaqasini tanlang</p>

            <!-- Abbreviation & Name Display -->
            <div id="stateContainer" class="min-h-[110px] flex flex-col items-center justify-center mb-6">
                <h1 id="stateAbbr" class="text-6xl sm:text-7xl font-black text-gray-900 tracking-wider">
                    CA
                </h1>
                <p id="stateName" class="text-sm font-bold text-gray-400 mt-1 uppercase tracking-widest">
                    California
                </p>
            </div>

            <!-- 4 ta Vaqt Mintaqasi Tugmalari (2x2 Grid) -->
            <div class="grid grid-cols-2 gap-3.5 max-w-md mx-auto">
                <button 
                    onclick="checkZone('Pacific')" 
                    class="zone-btn bg-gray-900 hover:bg-black text-white font-extrabold py-4 px-4 rounded-2xl btn-glow hover:scale-[1.03] active:scale-95 transition-all duration-200 cursor-pointer border border-gray-800 text-sm tracking-wide"
                >
                    Pacific
                </button>

                <button 
                    onclick="checkZone('Mountain')" 
                    class="zone-btn bg-gray-900 hover:bg-black text-white font-extrabold py-4 px-4 rounded-2xl btn-glow hover:scale-[1.03] active:scale-95 transition-all duration-200 cursor-pointer border border-gray-800 text-sm tracking-wide"
                >
                    Mountain
                </button>

                <button 
                    onclick="checkZone('Central')" 
                    class="zone-btn bg-gray-900 hover:bg-black text-white font-extrabold py-4 px-4 rounded-2xl btn-glow hover:scale-[1.03] active:scale-95 transition-all duration-200 cursor-pointer border border-gray-800 text-sm tracking-wide"
                >
                    Central
                </button>

                <button 
                    onclick="checkZone('Eastern')" 
                    class="zone-btn bg-gray-900 hover:bg-black text-white font-extrabold py-4 px-4 rounded-2xl btn-glow hover:scale-[1.03] active:scale-95 transition-all duration-200 cursor-pointer border border-gray-800 text-sm tracking-wide"
                >
                    Eastern
                </button>
            </div>

            <!-- Progress Footer -->
            <div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between text-xs font-semibold text-gray-400">
                <span>Jarayon</span>
                <span id="progressText">1 / 50 Shtatlar</span>
            </div>

        </div>
    </main>

    <!-- FOOTER LOGO -->
    <footer class="text-xs text-gray-400 font-medium">
        Amerika logistikasi • Amerika vaqt mintaqalari
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // BARCHA 50 TA AQSH SHTATLARINING ASOSIY VAQT MINTAQASI
        const usStatesData = [
            // PACIFIC TIME (PT)
            { abbr: "CA", name: "California", zone: "Pacific" },
            { abbr: "NV", name: "Nevada", zone: "Pacific" },
            { abbr: "OR", name: "Oregon", zone: "Pacific" },
            { abbr: "WA", name: "Washington", zone: "Pacific" },
            { abbr: "AK", name: "Alaska", zone: "Pacific" },
            { abbr: "HI", name: "Hawaii", zone: "Pacific" },

            // MOUNTAIN TIME (MT)
            { abbr: "AZ", name: "Arizona", zone: "Mountain" },
            { abbr: "CO", name: "Colorado", zone: "Mountain" },
            { abbr: "ID", name: "Idaho", zone: "Mountain" },
            { abbr: "MT", name: "Montana", zone: "Mountain" },
            { abbr: "NM", name: "New Mexico", zone: "Mountain" },
            { abbr: "UT", name: "Utah", zone: "Mountain" },
            { abbr: "WY", name: "Wyoming", zone: "Mountain" },

            // CENTRAL TIME (CT)
            { abbr: "AL", name: "Alabama", zone: "Central" },
            { abbr: "AR", name: "Arkansas", zone: "Central" },
            { abbr: "IL", name: "Illinois", zone: "Central" },
            { abbr: "IA", name: "Iowa", zone: "Central" },
            { abbr: "KS", name: "Kansas", zone: "Central" },
            { abbr: "LA", name: "Louisiana", zone: "Central" },
            { abbr: "MN", name: "Minnesota", zone: "Central" },
            { abbr: "MS", name: "Mississippi", zone: "Central" },
            { abbr: "MO", name: "Missouri", zone: "Central" },
            { abbr: "NE", name: "Nebraska", zone: "Central" },
            { abbr: "ND", name: "North Dakota", zone: "Central" },
            { abbr: "OK", name: "Oklahoma", zone: "Central" },
            { abbr: "SD", name: "South Dakota", zone: "Central" },
            { abbr: "TN", name: "Tennessee", zone: "Central" },
            { abbr: "TX", name: "Texas", zone: "Central" },
            { abbr: "WI", name: "Wisconsin", zone: "Central" },

            // EASTERN TIME (ET)
            { abbr: "CT", name: "Connecticut", zone: "Eastern" },
            { abbr: "DE", name: "Delaware", zone: "Eastern" },
            { abbr: "FL", name: "Florida", zone: "Eastern" },
            { abbr: "GA", name: "Georgia", zone: "Eastern" },
            { abbr: "IN", name: "Indiana", zone: "Eastern" },
            { abbr: "KY", name: "Kentucky", zone: "Eastern" },
            { abbr: "ME", name: "Maine", zone: "Eastern" },
            { abbr: "MD", name: "Maryland", zone: "Eastern" },
            { abbr: "MA", name: "Massachusetts", zone: "Eastern" },
            { abbr: "MI", name: "Michigan", zone: "Eastern" },
            { abbr: "NH", name: "New Hampshire", zone: "Eastern" },
            { abbr: "NJ", name: "New Jersey", zone: "Eastern" },
            { abbr: "NY", name: "New York", zone: "Eastern" },
            { abbr: "NC", name: "North Carolina", zone: "Eastern" },
            { abbr: "OH", name: "Ohio", zone: "Eastern" },
            { abbr: "PA", name: "Pennsylvania", zone: "Eastern" },
            { abbr: "RI", name: "Rhode Island", zone: "Eastern" },
            { abbr: "SC", name: "South Carolina", zone: "Eastern" },
            { abbr: "VT", name: "Vermont", zone: "Eastern" },
            { abbr: "VA", name: "Virginia", zone: "Eastern" },
            { abbr: "WV", name: "West Virginia", zone: "Eastern" }
        ];

        // O'yin xolati va hisoblagichlar
        let gameStates = [];
        let currentIndex = 0;
        let correctCount = 0;
        let attemptsCount = 0;
        let isProcessing = false;

        // DOM Elementlari
        const stateAbbrEl = document.getElementById('stateAbbr');
        const stateNameEl = document.getElementById('stateName');
        const correctScoreEl = document.getElementById('correctScore');
        const attemptsScoreEl = document.getElementById('attemptsScore');
        const progressTextEl = document.getElementById('progressText');
        const gameCard = document.getElementById('gameCard');

        // Massivni tasodifiy aralashtirish (Fisher-Yates Shuffle)
        function shuffle(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // O'yinni boshlash
        function initGame() {
            gameStates = shuffle(usStatesData);
            currentIndex = 0;
            correctCount = 0;
            attemptsCount = 0;
            updateScores();
            loadCurrentState();
        }

        // Joriy shtat ma'lumotlarini yuklash
        function loadCurrentState() {
            if (currentIndex >= gameStates.length) {
                alert(`🎉 Ajoyib! Siz 50 ta shtat vaqt mintaqalarini to'g'ri topdiz!\nUmimiy urinishlar soni: ${attemptsCount}`);
                initGame();
                return;
            }

            const state = gameStates[currentIndex];
            stateAbbrEl.textContent = state.abbr;
            stateNameEl.textContent = state.name;
            progressTextEl.textContent = `${currentIndex + 1} / ${gameStates.length} Shtatlar`;

            // Silliq paydo bo'lish animatsiyasi
            gameCard.classList.remove('pop-in');
            void gameCard.offsetWidth; // reflow
            gameCard.classList.add('pop-in');
        }

        // Statistikani yangilash
        function updateScores() {
            correctScoreEl.textContent = correctCount;
            attemptsScoreEl.textContent = attemptsCount;
        }

        // Vaqt mintaqasi bosilganda ishlaydigan tekshiruv funksiyasi
        function checkZone(selectedZone) {
            if (isProcessing) return;

            isProcessing = true;
            attemptsCount++;

            const currentState = gameStates[currentIndex];

            if (selectedZone === currentState.zone) {
                // === TO'G'RI JAVOB ===
                correctCount++;
                updateScores();

                // Ekran silliq yashil bo'ladi
                document.body.classList.add('flash-correct');

                setTimeout(() => {
                    document.body.classList.remove('flash-correct');
                    currentIndex++;
                    loadCurrentState();
                    isProcessing = false;
                }, 450);

            } else {
                // === NOTO'G'RI JAVOB ===
                updateScores();

                // Ekran silliq qizil bo'ladi va karta titraydi
                document.body.classList.add('flash-incorrect');
                gameCard.classList.add('shake-anim');

                setTimeout(() => {
                    document.body.classList.remove('flash-incorrect');
                    gameCard.classList.remove('shake-anim');
                    isProcessing = false;
                }, 500);
            }
        }

        // Sahifa yuklanishi bilan o'yinni ishga tushirish
        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });
    </script>
</body>
</html>
