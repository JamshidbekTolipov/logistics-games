<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amerika logistikasi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f6;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        /* To'g'ri javobda yashil miltillash effekti */
        body.flash-correct {
            background-color: #10b981 !important; /* Soft Emerald Green */
        }

        /* Noto'g'ri javobda qizil miltillash effekti */
        body.flash-incorrect {
            background-color: #f43f5e !important; /* Soft Rose Red */
        }

        /* Kartalar uchun zamonaviy soya */
        .card-shadow {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08), 0 18px 36px -18px rgba(0, 0, 0, 0.05);
        }

        .btn-glow {
            box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.35);
        }

        /* Noto'g'ri javob berilgandagi titrash (Shake) animatsiyasi */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        .shake-anim {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Yangi so'z chiqqandagi silliq paydo bo'lish animatsiyasi */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-8 select-none">

    <!-- TOP NAVIGATION BAR -->
    <header class="w-full max-w-4xl flex items-center justify-between z-20">
        <!-- Yuqori Chap: Uycha (Home) ikonkasi -->
        <a href="index.html" title="Main Page" class="w-12 h-12 bg-white/80 backdrop-blur-md rounded-2xl border border-white/80 card-shadow flex items-center justify-center text-gray-800 hover:scale-110 active:scale-95 transition-all duration-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
        </a>

        <!-- Yuqori O'ng: Statistikalar (To'g'ri va Urinishlar) -->
        <div class="flex items-center space-x-3 bg-white/80 backdrop-blur-md px-5 py-2.5 rounded-2xl border border-white/80 card-shadow text-sm font-semibold text-gray-700">
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span>To'g'ri javob: <strong id="correctScore" class="text-gray-900 font-extrabold text-base">0</strong></span>
            </div>
            <span class="text-gray-300">|</span>
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <span>Urinishlar: <strong id="attemptsScore" class="text-gray-900 font-extrabold text-base">0</strong></span>
            </div>
        </div>
    </header>

    <!-- MAIN GAME CARD CONTAINER -->
    <main class="w-full max-w-lg my-auto py-6">
        <div id="gameCard" class="w-full bg-white/90 backdrop-blur-xl rounded-[36px] p-8 sm:p-10 card-shadow border border-white/80 text-center relative overflow-hidden transition-all duration-300">
            
            <!-- Top Tag -->
            <div class="inline-flex items-center space-x-2 bg-gray-100 px-3.5 py-1 rounded-full text-xs font-bold text-gray-500 tracking-wider uppercase mb-6">
                <span>🔤 Logistika qisqartmalari</span>
            </div>

            <!-- Subtitle Instructions -->
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Write Full Term Meaning</p>

            <!-- Acronym Display -->
            <div id="acronymContainer" class="min-h-[100px] flex items-center justify-center mb-6">
                <h1 id="acronymText" class="text-5xl sm:text-6xl font-black text-gray-900 tracking-wider">
                    DHD
                </h1>
            </div>

            <!-- Input Form -->
            <form id="quizForm" onsubmit="handleCheck(event)" class="space-y-5">
                <div class="relative max-w-md mx-auto">
                    <input 
                        type="text" 
                        id="termInput" 
                        placeholder="e.g. Deadhead" 
                        autocomplete="off" 
                        spellcheck="false"
                        autofocus
                        class="w-full text-center text-lg font-bold py-3.5 px-4 bg-gray-50 border-2 border-gray-200 rounded-2xl text-gray-900 placeholder-gray-300 focus:outline-none focus:border-black focus:bg-white transition-all duration-200 shadow-inner"
                    />
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full max-w-md mx-auto bg-[#111] hover:bg-black text-white font-bold py-4 px-6 rounded-2xl btn-glow hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center space-x-2 cursor-pointer border border-gray-800"
                >
                    <span>Submit Answer</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </form>

            <!-- Progress Footer -->
            <div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between text-xs font-semibold text-gray-400">
                <span>Progress</span>
                <span id="progressText">1 / 21 Qisqartmalar</span>
            </div>

        </div>
    </main>

    <!-- FOOTER LOGO -->
    <footer class="text-xs text-gray-400 font-medium">
        Logistics Training Game • Dispatch Acronyms
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // SIZ TANLAGAN VA QO'SHGAN BARCHA LOGISTIKA QISQARTMALARI
        const acronymsData = [
            { abbr: "GVWR", name: "Gross Vehicle Weight Rating", accept: ["gross vehicle weight rating"] },
            { abbr: "CDL", name: "Commercial Driver's License", accept: ["commercial drivers license", "commercial driver license", "commercial driver's license"] },
            { abbr: "BOL", name: "Bill of Lading", accept: ["bill of lading"] },
            { abbr: "POD", name: "Proof of Delivery", accept: ["proof of delivery"] },
            { abbr: "ETA", name: "Estimated Time of Arrival", accept: ["estimated time of arrival"] },
            { abbr: "ETD", name: "Estimated Time of Departure", accept: ["estimated time of departure"] },
            { abbr: "RPM", name: "Rate Per Mile", accept: ["rate per mile"] },
            { abbr: "TONU", name: "Truck Ordered Not Used", accept: ["truck ordered not used"] },
            { abbr: "DOT", name: "Department of Transportation", accept: ["department of transportation"] },
            { abbr: "ELD", name: "Electronic Logging Device", accept: ["electronic logging device"] },
            
            // SIZ QO'SHGAN YANGI QISQARTMALAR:
            { abbr: "DHD", name: "Deadhead", accept: ["deadhead", "dead head"] },
            { abbr: "DD", name: "Dock Door", accept: ["dock door", "dockdoor"] },
            { abbr: "ROC", name: "Relay Operation System", accept: ["relay operation system", "relay operations system", "relay operations center", "relay operation center"] },
            { abbr: "SDT", name: "Scheduled Departure Time", accept: ["scheduled departure time"] },
            { abbr: "SAT", name: "Scheduled Arrival Time", accept: ["scheduled arrival time"] },
            { abbr: "PS", name: "Parking Spot", accept: ["parking spot"] },
            { abbr: "GS", name: "Guard Shack", accept: ["guard shack"] },
            { abbr: "PTI", name: "Pre Trip Inspection", accept: ["pre trip inspection", "pre-trip inspection", "pretrip inspection"] },
            { abbr: "WO", name: "Work Order", accept: ["work order"] },
            { abbr: "SCAC", name: "Standard Carrier Alpha Code", accept: ["standard carrier alpha code", "standart carrier alpha code"] },
            { abbr: "DVIR", name: "Driver Vehicle Inspection Report", accept: ["driver vehicle inspection report"] }
        ];

        // O'yin xolati
        let gameList = [];
        let currentIndex = 0;
        let correctCount = 0;
        let attemptsCount = 0;
        let isProcessing = false;

        // DOM Elementlari
        const acronymTextEl = document.getElementById('acronymText');
        const termInput = document.getElementById('termInput');
        const correctScoreEl = document.getElementById('correctScore');
        const attemptsScoreEl = document.getElementById('attemptsScore');
        const progressTextEl = document.getElementById('progressText');
        const gameCard = document.getElementById('gameCard');

        // Massivni tasodifiy aralashtirish
        function shuffle(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Matnni solishtirish uchun normallashtirish (probeller, tirularni tozalash)
        function cleanText(str) {
            return str.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        // O'yinni boshlash
        function initGame() {
            gameList = shuffle(acronymsData);
            currentIndex = 0;
            correctCount = 0;
            attemptsCount = 0;
            updateScores();
            loadCurrentItem();
        }

        // Joriy qisqartmani yuklash
        function loadCurrentItem() {
            if (currentIndex >= gameList.length) {
                alert(`🎉 Ajoyib! Siz logistikadagi barcha qisqartmalarni to'g'ri topdiz!\nUmumiy urinishlar: ${attemptsCount}`);
                initGame();
                return;
            }

            const item = gameList[currentIndex];
            acronymTextEl.textContent = item.abbr;
            progressTextEl.textContent = `${currentIndex + 1} / ${gameList.length} Qisqartmalar`;

            termInput.value = '';
            termInput.focus();

            gameCard.classList.remove('pop-in');
            void gameCard.offsetWidth; // reflow
            gameCard.classList.add('pop-in');
        }

        // Statistikani yangilash
        function updateScores() {
            correctScoreEl.textContent = correctCount;
            attemptsScoreEl.textContent = attemptsCount;
        }

        // Javobni tekshirish
        function handleCheck(e) {
            e.preventDefault();
            if (isProcessing) return;

            const userVal = termInput.value.trim();
            if (!userVal) return;

            isProcessing = true;
            attemptsCount++;

            const currentItem = gameList[currentIndex];
            const userClean = cleanText(userVal);

            // Aqlli solishtirish (qabul qilinadigan variantlardan birortasiga mos kelsa)
            const isMatch = currentItem.accept.some(acc => cleanText(acc) === userClean);

            if (isMatch) {
                // === TO'G'RI JAVOB ===
                correctCount++;
                updateScores();

                document.body.classList.add('flash-correct');

                setTimeout(() => {
                    document.body.classList.remove('flash-correct');
                    currentIndex++;
                    loadCurrentItem();
                    isProcessing = false;
                }, 500);

            } else {
                // === NOTO'G'RI JAVOB ===
                updateScores();

                document.body.classList.add('flash-incorrect');
                gameCard.classList.add('shake-anim');

                termInput.classList.add('border-rose-500', 'bg-rose-50');

                setTimeout(() => {
                    document.body.classList.remove('flash-incorrect');
                    gameCard.classList.remove('shake-anim');
                    termInput.classList.remove('border-rose-500', 'bg-rose-50');
                    
                    termInput.value = '';
                    termInput.focus();
                    isProcessing = false;
                }, 550);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });
    </script>
</body>
</html>
